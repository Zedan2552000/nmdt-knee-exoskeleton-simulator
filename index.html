<style>
  :root {
    --bg: #050811;

    font-family: 'Cairo', 'Inter', sans-serif;
    background-color: var(--bg);
    color: #f8fafc;
    overflow-x: hidden;
    user-select: none;
  }
  body.en-mode {
    direction: ltr;
    font-family: 'Inter', 'Cairo', sans-serif;

  /* Compact Top Bar */
  .top-header {
    background: linear-gradient(90deg, #090d16 0%, #0f172a 50%, #090d16 100%);
    border-bottom: 2px solid #0284c7;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    font-weight: 900;
    color: #fff;
  }
  .brand-badge {
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid #38bdf8;
    color: #38bdf8;

    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 800;
  }
  .top-actions {

    align-items: center;
    gap: 6px;
    flex-wrap: wrap;

  .pill-btn {
    background: #111827;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 4px 11px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.18s;
  }
  .pill-btn:hover, .pill-btn.active {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56,189,248,0.4);

  /* Paper Selector Strip */
  .tabs-bar {
    background: #090d16;
    border-bottom: 1px solid #1e293b;
    padding: 6px 12px;
    display: flex;
    gap: 5px;
    overflow-x: auto;
  }
  .tab-chip {
    background: #0f172a;
    border: 1px solid #1e293b;
    color: #94a3b8;
    padding: 5px 11px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 800;

    cursor: pointer;

  .studio-wrap {

    margin: 8px auto;
    padding: 0 10px;
  }

    background: #070b14;

function setLang(l) {
  lang = l;
  document.body.classList.toggle('en-mode', l === 'en');
  document.getElementById('btn-ar').classList.toggle('active', l === 'ar');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('hdr-title').textContent = (l === 'en')
    ? 'Interactive 60-FPS Motion-Graphics Studio — 10 Core Exoskeleton Papers & NMDT Digital Twin'
    : 'مختبر الموشن جرافيك التفاعلي للأبحاث العشرة — التوأم الرقمي لهيكل الركبة (NMDT)';
  renderTabs();
  renderDock();
}

function setTab(id) {
  currentTab = id;
  renderTabs();
  renderDock();
}

function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = TABS.map(t =>
    `<button class="tab-chip ${currentTab === t.id ? 'active' : ''}" onclick="setTab(${t.id})">${lang === 'en' ? t.en : t.ar}</button>`
  ).join('');
}

function renderDock() {
  const dock = document.getElementById('controls-dock');
  const list = SLIDERS[currentTab] || [];
  dock.innerHTML = list.map(([key, lbl, sub, minV, maxV, stepV, unit]) => `
    <div class="dock-item">
      <div class="dock-head"><span>${lbl}</span><span class="dock-val" id="v-${key}">${S[key]}${unit}</span></div>
      <div class="dock-sub">${sub}</div>
      <input type="range" min="${minV}" max="${maxV}" step="${stepV}" value="${S[key]}" oninput="onSlide('${key}', this.value, '${unit}')">
    </div>
  `).join('');
}

function onSlide(key, val, unit) {
  S[key] = parseFloat(val);
  const el = document.getElementById('v-' + key);
  if (el) el.textContent = val + unit;
}

// ============================================================================
// DRAWING HELPERS FOR MULTI-PANEL 60-FPS MOTION STUDIO (1400 x 620)
// ============================================================================
function drawPanel(ctx, x, y, w, h, title, borderCol='#1e293b') {
  ctx.fillStyle = '#0b1120';
  ctx.strokeStyle = borderCol;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.stroke();

  // Header strip
  ctx.fillStyle = 'rgba(30, 41, 59, 0.65)';
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, w - 2, 26, [7, 7, 0, 0]);
  ctx.fill();

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 12.5px Inter, Cairo, sans-serif';
  ctx.fillText(title, x + 10, y + 18);
}

function drawTopBanner(ctx, code, qBadge, title, meta, qDetail) {
  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(10, 8, 1380, 66, 8);
  ctx.fill();
  ctx.stroke();

  // Left badge
  ctx.fillStyle = '#0284c7';
  ctx.beginPath(); ctx.roundRect(20, 15, 120, 22, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Inter, sans-serif';
  ctx.fillText(code, 30, 30);

  // Right Quartile badge
  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.roundRect(1140, 14, 240, 22, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11.5px Inter, sans-serif';
  ctx.fillText(qBadge, 1150, 29);

  // Title
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px Inter, sans-serif';
  ctx.fillText(title.length > 105 ? title.substring(0, 105) + '...' : title, 150, 30);

  // Meta & Quartile Detail
  ctx.fillStyle = '#94a3b8'; ctx.font = '11.5px Inter, sans-serif';
  ctx.fillText(meta, 20, 50);
  ctx.fillStyle = '#fde047'; ctx.font = 'bold 11.5px Inter, sans-serif';
  ctx.fillText(qDetail, 20, 67);
}

function drawHumanAvatar(ctx, cx, floorY, kneeDeg, hipDeg, boxKg, exoCol, sensors) {
  const rk = (kneeDeg * Math.PI) / 180;
  const rh = (hipDeg * Math.PI) / 180;
  const Ls = 68, Lt = 70, Ltr = 82;

  const ax = cx, ay = floorY;
  const kx = ax + Math.sin(rk * 0.45) * Ls;
  const ky = ay - Math.cos(rk * 0.45) * Ls;
  const hx = kx - Math.sin(rk * 0.55) * Lt;
  const hy = ky - Math.cos(rk * 0.55) * Lt;
  const sx = hx + Math.sin(rh) * Ltr;
  const sy = hy - Math.cos(rh) * Ltr;

  // Floor grid
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 95, floorY + 4); ctx.lineTo(cx + 105, floorY + 4); ctx.stroke();

  // Foot
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax - 8, ay); ctx.lineTo(ax + 26, ay); ctx.stroke();

  // Limb segments
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(kx, ky); ctx.lineTo(hx, hy); ctx.lineTo(sx, sy); ctx.stroke();

  // Head
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.arc(sx + Math.sin(rh)*14, sy - 16, 13, 0, Math.PI*2); ctx.fill();

  // Exoskeleton Struts & Motor
  if (exoCol) {
    ctx.strokeStyle = exoCol; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ax + 7, ay); ctx.lineTo(kx + 7, ky); ctx.lineTo(hx + 7, hy); ctx.stroke();
    ctx.fillStyle = exoCol;
    ctx.beginPath(); ctx.arc(kx, ky, 11, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kx, ky, 15, -0.7, 1.5); ctx.stroke();
  }

  // Arms & Box
  if (boxKg > 0) {
    const bx = sx + 38, by = sy + 36;
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = '#0284c7'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx - 14, by - 12, 48, 36, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Inter, sans-serif';
    ctx.fillText(boxKg + 'kg', bx - 6, by + 10);
  }

  // Glowing Sensor Nodes on Body
  const pulse = (Math.sin(tick * 0.15) + 1) * 3;
  (sensors || []).forEach(s => {
    let px = kx, py = ky;
    if (s.pos === 'knee') { px = kx; py = ky; }
    else if (s.pos === 'thigh') { px = (kx + hx)/2 + 6; py = (ky + hy)/2; }
    else if (s.pos === 'shank') { px = (ax + kx)/2 + 6; py = (ay + ky)/2; }
    else if (s.pos === 'insole') { px = ax + 12; py = ay + 2; }
    else if (s.pos === 'chest') { px = (hx + sx)/2; py = (hy + sy)/2; }
    else if (s.pos === 'waist') { px = hx; py = hy; }
    else if (s.pos === 'quad_emg') { px = (kx + hx)/2 - 10; py = (ky + hy)/2 - 6; }

    ctx.fillStyle = s.active ? '#4ade80' : '#fbbf24';
    ctx.beginPath(); ctx.arc(px, py, 4.5 + pulse*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = s.active ? '#86efac' : '#fde047';
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText(s.lbl, px + 9, py + 3);
  });

  return { ax, ay, kx, ky, hx, hy, sx, sy };
}

function drawSignalFlowPipeline(ctx, x, y, w, h, activeIn, computedOut, modeBadge, eqLines) {
  drawPanel(ctx, x, y, w, h, '4 & 5. Sensor Signal Flow (Inputs ➔ Controller Equations ➔ Outputs)');

  const bw = (w - 50) / 3;
  const bh = 86;
  const by = y + 36;

  const boxes = [
    [x + 12, 'A) SENSORY INPUTS', activeIn, '#0284c7'],
    [x + 24 + bw, 'B) COMPUTED OUTPUTS', computedOut, '#9333ea'],
    [x + 36 + bw*2, 'C) LOOP UTILIZATION', modeBadge, '#16a34a']
  ];

  boxes.forEach(([bx, title, lines, col], i) => {
    ctx.fillStyle = '#070b14'; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.font = 'bold 11px Inter, sans-serif';
    ctx.fillText(title, bx + 8, by + 16);
    lines.forEach((l, li) => {
      ctx.fillStyle = '#e2e8f0'; ctx.font = '10.8px Inter, Cairo, sans-serif';
      ctx.fillText(l, bx + 8, by + 34 + li * 16);
    });

    // Animated pulses along arrows between boxes
    if (i < 2) {
      const ax1 = bx + bw + 2, ax2 = bx + bw + 10;
      const ay = by + bh/2;
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax1, ay); ctx.lineTo(ax2, ay); ctx.stroke();

function drawOscilloscope(ctx, x, y, w, h, title, fn1, col1, lbl1, fn2, col2, lbl2, extraText) {
  drawPanel(ctx, x, y, w, h, title);
  const gx = x + 14, gy = y + 34, gw = w - 28, gh = h - 68;

  ctx.fillStyle = '#050811'; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
  ctx.fillRect(gx, gy, gw, gh); ctx.strokeRect(gx, gy, gw, gh);

  // Grid lines
  ctx.strokeStyle = 'rgba(148,163,184,0.12)';
  ctx.beginPath();
  ctx.moveTo(gx, gy + gh*0.5); ctx.lineTo(gx + gw, gy + gh*0.5);
  ctx.moveTo(gx + gw*0.5, gy); ctx.lineTo(gx + gw*0.5, gy + gh);
  ctx.stroke();

  // Wave 1
  ctx.strokeStyle = col1; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i <= gw; i += 4) {
    const u = i / gw;
    const py = gy + gh*0.82 - fn1(u) * (gh * 0.68);
    if (i === 0) ctx.moveTo(gx + i, py); else ctx.lineTo(gx + i, py);
  }
  ctx.stroke();

  // Wave 2
  if (fn2) {
    ctx.strokeStyle = col2; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let i = 0; i <= gw; i += 4) {
      const u = i / gw;
      const py = gy + gh*0.82 - fn2(u) * (gh * 0.68);
      if (i === 0) ctx.moveTo(gx + i, py); else ctx.lineTo(gx + i, py);
    }
    ctx.stroke();
  }

  // Legend
  ctx.font = 'bold 11px Inter, sans-serif';
  ctx.fillStyle = col1; ctx.fillText('▬ ' + lbl1, gx + 6, y + h - 12);
  if (lbl2) {
    ctx.fillStyle = col2; ctx.fillText('▬ ' + lbl2, gx + 210, y + h - 12);
  }
  if (extraText) {
    ctx.fillStyle = '#fde047'; ctx.fillText(extraText, gx + 6, gy + 16);
  }
}

function drawBarsAndGapPanel(ctx, x, y, w, h, title, bars, protocolLine, limLine, gapLine) {
  drawPanel(ctx, x, y, w, h, title);

  ctx.fillStyle = '#c084fc'; ctx.font = 'bold 11.5px Inter, Cairo, sans-serif';
  ctx.fillText('🧪 Protocol: ' + protocolLine, x + 12, y + 44);

  const startY = y + 58;
  const rowH = 26;
  bars.forEach(([lbl, valTxt, ratio, col], i) => {
    const by = startY + i * rowH;
    ctx.fillStyle = '#cbd5e1'; ctx.font = 'bold 11px Inter, sans-serif';
    ctx.fillText(lbl, x + 12, by + 13);

    const barX = x + 190, barW = w - 285;
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.roundRect(barX, by + 2, barW, 14, 4); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(barX, by + 2, Math.max(6, barW * Math.min(1, ratio)), 14, 4); ctx.fill();

    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Fira Code, monospace';
    ctx.fillText(valTxt, barX + barW + 8, by + 13);
  });

  // Limitation & NMDT Gap boxes at bottom
  const ly = y + h - 88;
  ctx.fillStyle = 'rgba(239, 68, 68, 0.12)'; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.2;

  ctx.fillStyle = '#fca5a5'; ctx.font = 'bold 11px Inter, Cairo, sans-serif';
  ctx.fillText('⚠️ Limitation: ' + limLine, x + 18, ly + 22);

  const gy = y + h - 46;

  ctx.beginPath(); ctx.roundRect(x + 10, gy, w - 20, 36, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#67e8f9'; ctx.font = 'bold 11px Inter, Cairo, sans-serif';
  ctx.fillText('🚀 Our NMDT Fix: ' + gapLine, x + 18, gy + 22);
}

    ctx.fillText('• QDD Actuator: 10:1 Planetary, 35 Nm, 1.7 kg/leg', 18, 578);
    ctx.fillText('• Vicon + Kistler used ONLY for offline training', 18, 598);

    drawSignalFlowPipeline(
      ctx, 350, 82, 520, 255,
      ["• Active: 6 IMUs (36-ch @ 200Hz)", "• Active: 2 Knee Torque Sensors", "• Offline Train: 8 Vicon + Kistler"],
      [`• Future Torque τ̂_k(t + ${S.p8_ts} ms)`, `• Command τ_assist (γ=${S.p8_gamma}%)`, "• Phase-Lag-Free Tracking"],
      ["• Active: 6 IMUs + 2 Torque Sens.", "• Offline Monitoring ONLY:", "  RF & VM sEMG (Validation)"],
      [
        "Eq.(1-6) Hybrid Spatial-Temporal Network: 1D-CNN (spatial IMU fusion) ➔ LSTM (temporal memory)",
        `Eq.(9) Time-Shifted Assistive Torque Law: τ_assist(t) = γ · τ̂_human(t + t_s)  [Optimal t_s = 50 ms]`,
        "Eq.(10-11) Muscle Effort Evaluation:      RMS_sEMG reduction across Rectus Femoris & Vastus Medialis"
      ]
    );

    const lag = ((50 - S.p8_ts) / 50) * 0.55;
    const rmse = (4.64 + Math.pow((S.p8_ts - 50)/10, 2) * 1.85).toFixed(2);
    drawOscilloscope(
      ctx, 350, 347, 520, 263,
      `Phase-Lag Cancellation via Time-Shift Horizon t_s = ${S.p8_ts} ms (Tracking RMSE = ${rmse}×10⁻³ Nm/kg)`,
      (u) => Math.max(0, Math.sin(u * Math.PI * 2 - t)),
      '#38bdf8', 'Biological Knee Torque Demand τ_human(t)',
      (u) => Math.max(0, Math.sin(u * Math.PI * 2 - t - lag)) * (S.p8_gamma / 35),
      S.p8_ts === 50 ? '#4ade80' : '#fbbf24',
      `Delivered QDD Torque (t_s = ${S.p8_ts} ms)`,
      S.p8_ts === 50 ? '✅ At t_s = 50 ms: Forecast exactly cancels actuator phase delay!' : '⚠️ Drag t_s slider to 50 ms to eliminate phase lag!'
    );

    drawBarsAndGapPanel(
      ctx, 880, 82, 510, 528,
      "7. Quantitative Results: 12-Step Stair Ascent (N = 5)",
      [
        ["CNN-LSTM Prediction R²", "R² > 0.96", 0.96, "#4ade80"],
        ["Optimal 50ms Tracking Error", `${rmse}e-3 Nm/kg`, Math.max(0.2, 1 - Math.abs(50-S.p8_ts)/80), "#38bdf8"],
        ["Rectus Femoris (RF sEMG)", "-20.87% Reduction", 0.82, "#22d3ee"],
        ["Vastus Medialis (VM sEMG)", "-17.45% Reduction", 0.70, "#c084fc"],
        ["Average Quadriceps sEMG", "-19.37% Reduction", 0.76, "#fbbf24"],
        ["Actuator Phase Delay @ 50ms", "0.0 ms (Cancelled ✅)", S.p8_ts === 50 ? 1.0 : 0.3, "#4ade80"]
      ],
      "N = 5 healthy subjects ascending 12-step staircase | Tested t_s ∈ {0, 25, 50, 75, 100} ms",
      "Trained on unloaded stairs only; IMUs alone cannot know external box mass or muscle fatigue.",
      "Direct foundation for our Module B (50ms CNN-LSTM), upgraded with Module A & C!"
    );
  }

  // ==========================================================================
  // PAPER #9: ZHAO ET AL. (2025) — IEEE/ASME TMECH (CS-SEA + RBFNN + DOB)
  // ==========================================================================
  else if (currentTab === 9) {
    drawTopBanner(
      ctx, "PAPER #9 (P9)", "Q1 (SJR: 2.540 / JCR Q1 Top 5%)",
      "Robust Adaptive Neural Force Control of a SEA-Based Knee Exoskeleton With Low Impedance",
      "Authors: Yanwei Zhao, Songhao Li, Jianda Han, and Weiguang Huo (Nankai University, Tianjin, China) | IEEE/ASME Transactions on Mechatronics (TMECH) 2025",
      "SCImago (SJR): Q1 Top 5% in Mechatronics & Control (SJR = 2.540) | Clarivate Web of Science (JCR): Q1 (IF = 6.1)"
    );

    drawPanel(ctx, 10, 82, 330, 528, "1. Crank-Slider Series Elastic Actuator (CS-SEA)");
    // Animated CS-SEA Mechanical Diagram
    const spDef = Math.sin(t * 2.2) * 22;
    ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.fillRect(30, 140, 280, 170); ctx.strokeRect(30, 140, 280, 170);
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 12px Inter, sans-serif';
    ctx.fillText('🔩 Animated CS-SEA Linear Spring & Crank', 42, 165);

    // Ball-screw nut + Series Elastic Spring coil
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(45, 200, 28, 60);
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let i = 0; i <= 9; i++) {
      const sx = 73 + (i / 9) * (95 + spDef);
      const sy = 230 + ((i % 2 === 0) ? -18 : 18);
      if (i === 0) ctx.moveTo(73, 230);
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    // Crank-slider output disk
    const cx = 245, cy = 230;
    ctx.fillStyle = '#c084fc';
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(168 + spDef, 230); ctx.lineTo(cx + Math.cos(spDef*0.04)*26, cy + Math.sin(spDef*0.04)*26); ctx.stroke();

    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 11.5px Inter, sans-serif';
    ctx.fillText('• 100% Active Control Sensors:', 22, 350);
    ctx.fillStyle = '#cbd5e1'; ctx.font = '11px Inter, sans-serif';
    ctx.fillText('  1. Knee Optical Encoder (θ_k)', 22, 372);
    ctx.fillText('  2. Motor Optical Encoder (θ_m)', 22, 392);
    ctx.fillText('  3. SEA Spring Deflection Sensor (Δx_s)', 22, 412);
    ctx.fillStyle = '#fde047';
    ctx.fillText('• Torque Law: τ_e = k_s · J_cs(θ_k) · Δx_s', 22, 445);
    ctx.fillText('• Zero-Torque Impedance = 1.03 Nm only!', 22, 468);

    drawSignalFlowPipeline(
      ctx, 350, 82, 520, 255,
      ["• Active: Knee Encoder θ_k", "• Active: Motor Encoder θ_m", "• Active: Spring Sensor Δx_s"],
      ["• RBFNN Approx Ŵ^T Φ(Z)", "• Disturbance Estimate d̂ (DOB)", "• Motor Control Voltage u(t)"],
      ["• 100% Active Closed-Loop!", "• Pure Electromechanical Control", "  (No sEMG or Metabolic Mask)"],
      [
        "CS-SEA Dynamics: M(θ_k)τ̈_e + C·τ̇_e + G = u + f_unknown(Z) + d_ext(t)",
        "RBFNN + DOB Law: f(Z) = W*^T Φ(Z) + ε  |  Ŵ̇ = Γ(Φ(Z)·s - σŴ)  [Online Weight Adaptation]",
        "Lyapunov Proof:  V = ½s² + ½W̃^T Γ⁻¹ W̃ + ½d̃²  ⟹  V̇ ≤ -κV + δ  (Guaranteed Stability!)"
      ]
    );

    const isRBF = S.p9_ctrl === 2;
    const isTrack = S.p9_mode === 1;
    const rmsErr = isRBF ? 0.31 : (0.95 + S.p9_dist * 0.16);
    drawOscilloscope(
      ctx, 350, 347, 520, 263,
      isTrack ? `Active Torque Tracking (RMS Error = ${rmsErr.toFixed(2)} Nm)` : `Zero-Torque Transparency Mode (Resistive Torque = 1.03 Nm)`,
      (u) => isTrack ? (0.45 + 0.42 * Math.sin(u * Math.PI * 2 - t)) : 0.12,
      '#38bdf8', isTrack ? 'Desired Reference Torque τ_d(t)' : 'Ideal Zero-Torque Reference (0 Nm)',
      (u) => {
        const ref = isTrack ? (0.45 + 0.42 * Math.sin(u * Math.PI * 2 - t)) : 0.12;
        const rip = (isRBF ? 0.02 : 0.16 * (S.p9_dist/5)) * Math.sin(u * 28 + t * 5);
        return ref + rip;
      },
      isRBF ? '#4ade80' : '#ef4444',
      isRBF ? '✅ Proposed RBFNN + DOB (0.31 Nm Error)' : '⚠️ Standard PID (Severe Friction Ripple)',
      `RBFNN learns linkage nonlinearities while DOB rejects fast friction spikes!`
    );

    drawBarsAndGapPanel(
      ctx, 880, 82, 510, 528,
      "7. Quantitative Results: Bench & Gait Tracking Benchmarks",
      [
        ["Active Torque Tracking Error", `${rmsErr.toFixed(2)} Nm RMS`, isRBF ? 0.95 : 0.35, isRBF ? "#4ade80" : "#ef4444"],
        ["Zero-Torque Resistance", "1.03 Nm (Transparent)", 0.90, "#38bdf8"],
        ["Disturbance Rejection (DOB)", `${S.p9_dist} Nm Cancelled`, 0.88, "#22d3ee"],
        ["Lyapunov Weight Convergence", "100% Bounded (UUB)", 0.98, "#c084fc"],
        ["Multi-Frequency Bandwidth", "High Fidelity", 0.85, "#fbbf24"],
        ["Biomechanical/sEMG Testing", "0% (Control Paper)", 0.08, "#f87171"]
      ],
      "Actuator bench & gait trajectory tracking under unknown friction & payload disturbances",
      "Low-level actuator controller only — assumes desired torque τ_d(t) is already known!",
      "Our Modules A, B & C generate the intelligent high-level τ_d(t) from sEMG & kinematics!"
    );
  }

  // ==========================================================================
  // PAPER #10: MONTEIRO ET AL. (2024) — SENSORS (10s EGPR + HITL CMA-ES)
  // ==========================================================================
  else if (currentTab === 10) {
    drawTopBanner(
      ctx, "PAPER #10 (P10)", "Q1 (SJR: 0.810) / Q2 (JCR IF: 3.4)",
      "Human-in-the-Loop Optimization of Knee Exoskeleton Assistance for Minimizing User’s Metabolic and Muscular Effort",
      "Authors: Sara Monteiro, Joana Figueiredo, Pedro Fonseca, J. Paulo Vilas-Boas, and Cristina P. Santos (Univ. of Minho & Univ. of Porto, Portugal) | Sensors 2024",
      "SCImago (SJR): Q1 in Instrumentation & Information Systems (SJR = 0.810) | Clarivate Web of Science (JCR): Q2 (IF = 3.4)"
    );

    drawPanel(ctx, 10, 82, 330, 528, "1. SmartOs (160:1 HD) + 4-IMU 10s EGPR");
    const wCyc = (Math.sin(t * (S.p10_spd / 1.1)) + 1) * 0.5;
    drawHumanAvatar(ctx, 145, 510, 8 + wCyc * 36, 6, 0, '#22d3ee', [
      { pos: 'chest', lbl: 'Chest IMU (Active EGPR)', active: true },
      { pos: 'waist', lbl: 'Waist + Wrist IMUs (Active)', active: true },
      { pos: 'insole', lbl: 'Right Ankle IMU (Active)', active: true },
      { pos: 'knee', lbl: 'Strain Gauges IT + Pot (Active)', active: true }
    ]);
    ctx.fillStyle = '#f87171'; ctx.font = 'bold 11.5px Inter, sans-serif';
    ctx.fillText(`⚠️ 160:1 Harmonic Drive Speed Cap = ${S.p10_spd} km/h!`, 18, 558);
    ctx.fillStyle = '#cbd5e1'; ctx.font = '11px Inter, sans-serif';
    ctx.fillText('• SmartOs (Technaid H2): Maxon EC60 100W + 160:1 HD', 18, 578);
    ctx.fillText('• UDOO X86 (100Hz EGPR/CMA-ES) + 2× STM32F4 (1kHz)', 18, 598);

    drawSignalFlowPipeline(
      ctx, 350, 82, 520, 255,
      ["• Active: 4 IMUs (100Hz) + BMI", "• Active: Frame Strain Gauges (IT)", "• Active: Knee Potentiometer"],
      ["• 10s EGPR Metabolic Cost (M̂C)", "• CMA-ES Peak Flex/Ext Torques", "• 13-Pt Cubic Spline T(P) @ 1kHz"],
      ["• 100% Active HITL Loop!", "• Cosmed K5 Mask used ONLY", "  in Protocol 1 Validation"],
      [
        "10s Mask-Free EGPR: 4 IMUs (100Hz) ➔ 20Hz Butterworth LP ➔ 10s MAD ➔ EGPR(σ=0.15) ➔ M̂C",
        "Eq.(1) Dual HITL Cost Function: CF = ω_1 · MC + ω_2 · IT  (ω_1=ω_2=1; 20 Gens × 6 = 20 min)",
        "Eq.(2) 13-Point Natural Cubic Spline: T(P) = t_i + a_i(P-p_i) + b_i(P-p_i)² + c_i(P-p_i)³"
      ]
    );

    const conv = (S.p10_gen - 1) / 19.0;
    const mcDrop = (conv * 7.3).toFixed(1);
    const itDrop = (conv * 32.3).toFixed(1);
    drawOscilloscope(
      ctx, 350, 347, 520, 263,
      `13-Point Cubic Spline Torque Evolution (Gen ${S.p10_gen}/20 = ${S.p10_gen} min elapsed)`,
      (u) => 0.45 + 0.40 * Math.sin(u * Math.PI * 2 - t),
      '#94a3b8', 'Initial Unoptimized Spline (±17.5 Nm)',
      (u) => 0.45 + (0.40 - 0.12*conv) * Math.sin(u * Math.PI * 2 - t - 0.28*conv),
      '#22d3ee', `CMA-ES Evolved Spline (IT -${itDrop}%, MC -${mcDrop}%)`,
      `Requires 120 iterations × 10s = 20 minutes of continuous treadmill walking!`
    );

    drawBarsAndGapPanel(
      ctx, 880, 82, 510, 528,
      `7. Quantitative Results: Protocol 1 (N=5) & Protocol 2 HITL (N=1)`,
      [
        ["Interaction Torque (IT) Drop", `-${itDrop}% (Max -32.3%)`, 0.15 + 0.80*conv, "#4ade80"],
        ["Metabolic Cost (vs Zero-Torque)", `-${mcDrop}% (Max -7.3%)`, 0.15 + 0.70*conv, "#38bdf8"],
        ["Metabolic Cost (vs No-Exo)", `-${(conv*5.9).toFixed(1)}% (Max -5.9%)`, 0.15 + 0.60*conv, "#22d3ee"],
        ["10s EGPR Online Accuracy", "RMSE = 0.66 W/kg", 0.85, "#c084fc"],
        ["CMA-ES Convergence Time", `${S.p10_gen} / 20 Minutes ⏳`, S.p10_gen/20, "#fbbf24"],
        ["160:1 HD Max Walking Speed", "1.6 km/h Ceiling ⚠️", 0.25, "#ef4444"]
      ],
      "Protocol 1: N = 5 (EGPR validation) | Protocol 2: N = 1 (20-min CMA-ES @ 1.5 km/h)",
      "160:1 Harmonic Drive caps speed at 1.6 km/h; CMA-ES takes 20 minutes to converge (N=1).",
      "Replaces 20-min CMA-ES & 160:1 HD with instant sEMG Module C & 9:1 QDD actuator!"
    );
  }
}

}
